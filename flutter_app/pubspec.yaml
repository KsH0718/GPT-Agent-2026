name: flutter_app
description: "나만의 AI Agent 채팅 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  file_picker: 10.3.10
  flutter_markdown: ^0.7.7
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: AppKorean
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
  assets:
    - assets/branding/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_logo.png
  web:
    generate: true
    image_path: assets/branding/app_logo.png
    background_color: '#DCEAF7'
    theme_color: '#364D70'
